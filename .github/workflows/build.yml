name: Build VoidFlame-ip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Verify JAR
        run: |
          test -f build/libs/VoidFlame-ip-1.0.0.jar
          jar tf build/libs/VoidFlame-ip-1.0.0.jar | grep -q 'net/voidflame/ip/VoidFlameIpPlugin.class'
          jar tf build/libs/VoidFlame-ip-1.0.0.jar | grep -q 'plugin.yml'
      - name: Publish direct JAR release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VoidFlame-ip Build ${{ github.run_number }}
          body: Automatic build from main. Download the JAR asset directly and place it in the server plugins folder.
          files: build/libs/*.jar
          prerelease: true