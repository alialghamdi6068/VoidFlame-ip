name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Verify JAR
        run: |
          test -f build/libs/VoidFlame-ip-1.0.0.jar
          jar tf build/libs/VoidFlame-ip-1.0.0.jar | grep -q 'net/voidflame/ip/VoidFlameIpPlugin.class'
          jar tf build/libs/VoidFlame-ip-1.0.0.jar | grep -q 'plugin.yml'
