# Players use custom_address in Minecraft.
# target is the real server endpoint this hostname must resolve to.
server:
  custom_address: "play.VoidFlame.net"
  target:
    host: "141.11.237.68"
    port: 7817

display:
  command:
    enabled: true
    lines:
      - ""
      - "&8&m----------------------------------------"
      - "&5&lVoidFlameMC"
      - "&7Server IP: &f%ip%"
      - "&8&m----------------------------------------"
      - ""

  join-message:
    enabled: false
    lines:
      - "&8[&5VoidFlame&8] &7Connect: &f%ip%"

messages:
  no-permission: "&cYou do not have permission to use this."
  reloaded: "&aVoidFlame-ip configuration reloaded."

performance:
  cache-display: true
