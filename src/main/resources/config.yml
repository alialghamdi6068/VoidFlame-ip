# ================================================================
# VoidFlame-ip • Custom Server Address
# Paper 26.2 • Java 25
# ================================================================
# Set the hostname players should use here.
# DNS still has to point this hostname to the server externally.
server:
  address: "play.VoidFlame.net"
  host: "play.VoidFlame.net"
  port: 7817

display:
  command:
    enabled: true
    lines:
      - ""
      - "&8&m----------------------------------------"
      - "&5&lVoidFlameMC"
      - "&7Server IP: &f%ip%"
      - "&8&m----------------------------------------"
      - ""
  join-message:
    enabled: false
    lines:
      - "&8[&5VoidFlame&8] &7Connect: &f%ip%"

messages:
  no-permission: "&cYou do not have permission to use this."
  reloaded: "&aVoidFlame-ip configuration reloaded."

performance:
  cache-display: true
