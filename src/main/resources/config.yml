# ================================================================
# VoidFlame-ip • Custom Server Address
# Paper 26.2 • Java 25
# ================================================================
# The address below is the real address players can use right now.
# You can change it to another address/hostname for display.
#
# IMPORTANT:
# A custom hostname such as play.VoidFlame.net must also point to the
# server through DNS. This plugin cannot create DNS records by itself.
#
# Current real server:
# 141.11.237.68:7817

server:
  address: "141.11.237.68:7817"
  host: "141.11.237.68"
  port: 7817

display:
  command:
    enabled: true
    lines:
      - ""
      - "&8&m----------------------------------------"
      - "&5&lVoidFlameMC"
      - "&7Server IP: &f%ip%"
      - "&8&m----------------------------------------"
      - ""

  join-message:
    enabled: false
    lines:
      - "&8[&5VoidFlame&8] &7Connect: &f%ip%"

messages:
  no-permission: "&cYou do not have permission to use this."
  reloaded: "&aVoidFlame-ip configuration reloaded."

performance:
  cache-display: true
